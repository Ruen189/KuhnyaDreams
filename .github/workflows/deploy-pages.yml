name: Deploy frontend to GitHub Pages

# Статическая сборка фронтенда уезжает на Pages при каждом пуше в main.
# API на Pages не живёт: адрес бэкенда приходит из переменной репозитория API_URL.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build SPA for the project subpath
        working-directory: frontend
        env:
          # Settings → Secrets and variables → Actions → Variables → API_URL
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback for deep links
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4